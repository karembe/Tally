# Phase 0: secret scanning only. Full pipeline arrives in Phase 2.

stages:
  - secrets

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

gitleaks:
  stage: secrets
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0   # full history, so secrets in older commits are found too
  script:
    - gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days
