services:
  db:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: ${TALLY_DB_PASSWORD:-tally}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tally-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 2s
      retries: 15

volumes:
  tally-db:
