replicaCount: 2

image:
  repository: localhost:5000/tally
  digest: ""

port: 8181

database:
  url: jdbc:postgresql://tally-db-rw:5432/tally
  ownerSecret: tally-db-owner
  passwordsSecret: tally-db-passwords

adminSecret: tally-admin

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi
