spring.application.name=tally
server.port=${TALLY_PORT:8181}

# The app runs as tally_app (no UPDATE/DELETE on history); Flyway runs as the schema owner.
spring.datasource.url=jdbc:postgresql://localhost:5433/tally
spring.datasource.username=tally_app
spring.datasource.password=${TALLY_APP_DB_PASSWORD:tally_app}
spring.flyway.user=${TALLY_DB_USER:tally}
spring.flyway.password=${TALLY_DB_PASSWORD:tally}
spring.flyway.placeholders.app_password=${TALLY_APP_DB_PASSWORD:tally_app}
spring.flyway.placeholders.verifier_password=${TALLY_VERIFIER_DB_PASSWORD:tally_verifier}

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Empty token disables funding entirely.
tally.admin-token=${TALLY_ADMIN_TOKEN:}
